name: ci

# The gate that keeps `main` honest. Before this existed only `release.yml`
# ran, and only on version tags — so lint could (and did) drift to a failing
# state unnoticed. Every push and pull request now runs the same three
# commands the README tells contributors to run locally.
on:
  push:
    branches: ['**']
  pull_request:
  # Lets a maintainer re-run the gate without pushing an empty commit.
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks are platform-independent — run them once, on the cheapest
  # runner, rather than duplicating them across the test matrix.
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

  test:
    # Space targets macOS and Windows (README), and a meaningful share of the
    # suite shells out to the real Git CLI, spawns real PTYs, and opens real
    # SQLite databases — behaviour that genuinely differs per platform, so the
    # tests run on all three rather than on Linux alone.
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The integration suite runs real `git` commands that refuse to work
      # without an identity, and CI runners have none configured.
      - name: Configure Git identity for integration tests
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Space CI"
          git config --global init.defaultBranch main

      # `pretest` rebuilds better-sqlite3 against the local Node ABI.
      - run: npm run test
