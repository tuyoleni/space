name: release

# Builds one Universal macOS DMG (Apple Silicon + Intel) and its update-compatible
# zip, then attaches both to a GitHub Release whenever a version tag is pushed.
# The bundle is currently ad-hoc signed; replace the identity and add notarization
# in forge.config.ts once an Apple Developer ID certificate is available.
#
# Electron Forge builds both slices on macos-14, rebuilds better-sqlite3 and
# node-pty for each target, then merges their Mach-O binaries with lipo.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run make --workspace apps/desktop -- --arch=universal

      - name: Prepare Universal release artifacts
        run: |
          dmg_path="$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)"
          zip_path="$(find apps/desktop/out/make -type f -name '*.zip' -print -quit)"
          test -n "$dmg_path"
          test -n "$zip_path"
          mkdir -p release-artifacts
          cp "$dmg_path" "release-artifacts/space-darwin-universal.dmg"
          cp "$zip_path" "release-artifacts/space-darwin-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: space-darwin-universal
          path: release-artifacts/*

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
