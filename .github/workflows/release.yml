name: release

# Builds one Universal macOS DMG (Apple Silicon + Intel) and its update-compatible
# zip, signs it with a Developer ID Application certificate, notarizes it with
# Apple, then attaches both to a GitHub Release whenever a version tag is pushed.
#
# forge.config.ts does the actual signing/notarization once the SPACE_APPLE_*
# env vars below are set (it falls back to an ad-hoc signature if they're
# absent, e.g. for a local `npm run make` without a Developer ID). This
# workflow's job is only importing the certificate into a throwaway keychain
# and decoding the notarization API key before `npm run make` runs, then
# tearing the keychain down again.
#
# Signing secrets, always required: APPLE_SIGNING_IDENTITY (the "Developer ID
# Application: NAME (TEAMID)" string), plus APPLE_CERTIFICATE_P12_BASE64 and
# APPLE_CERTIFICATE_PASSWORD (a base64'd .p12 export of that certificate and
# its password).
#
# Notarization secrets, one set or the other:
#   - App Store Connect API key (preferred): APPLE_API_KEY_P8_BASE64,
#     APPLE_API_KEY_ID, APPLE_API_ISSUER.
#   - Apple ID + app-specific password: APPLE_ID, APPLE_APP_PASSWORD, and
#     APPLE_TEAM_ID if APPLE_SIGNING_IDENTITY doesn't end in "(TEAMID)".
# Set neither and the build is signed but not notarized.
#
# Electron Forge builds both slices on macos-14, rebuilds better-sqlite3 and
# node-pty for each target, then merges their Mach-O binaries with lipo.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Import Developer ID certificate into a throwaway keychain
        if: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/space-signing.keychain-db"
          # Only ever needs to survive this job; generated fresh so nothing
          # keychain-related is a long-lived secret.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"

          # Lets `codesign` use the imported key without a GUI prompt, then
          # puts this keychain ahead of the default so Forge's codesign call
          # actually finds the identity.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

      # Only when an API key is configured. Without the secret this writes
      # nothing and SPACE_APPLE_API_KEY stays empty below, which is what makes
      # forge.config.ts fall through to the app-specific password.
      - name: Write notarization API key
        if: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: echo -n "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"

      - run: npm run make --workspace apps/desktop -- --arch=universal
        env:
          SPACE_APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SPACE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPACE_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          SPACE_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          SPACE_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SPACE_APPLE_ID: ${{ secrets.APPLE_ID }}
          SPACE_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Remove throwaway keychain
        if: ${{ always() && secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
        run: security delete-keychain "$RUNNER_TEMP/space-signing.keychain-db" || true

      - name: Prepare Universal release artifacts
        run: |
          dmg_path="$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)"
          zip_path="$(find apps/desktop/out/make -type f -name '*.zip' -print -quit)"
          test -n "$dmg_path"
          test -n "$zip_path"
          mkdir -p release-artifacts
          cp "$dmg_path" "release-artifacts/space-darwin-universal.dmg"
          cp "$zip_path" "release-artifacts/space-darwin-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: space-darwin-universal
          path: release-artifacts/*

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
